<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Offline | LeafPTE</title>
    <style>
        html {
            background-image: url(lokimeow.gif);
            background-size: cover;
        }
        html, body {
            height: 100vh; width: 100vw; padding: 0px; margin: 0px;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        div {
            background-color: rgba(0, 0, 0, 0.603);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 10px;
        }
        div p {
            color: white;
            font-size: 23px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div>
        <p>The local server is not responding.</p>
    </div>
</body>
</html>
